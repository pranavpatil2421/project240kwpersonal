 <!-- Basic Page for Equipment Information Page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Module 1 – Equipment Information</title>

  <!-- React CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    input, textarea, select {
      width: 300px;
      margin-bottom: 8px;
      padding: 6px;
    }
    button {
      padding: 8px 16px;
      margin-top: 10px;
    }
    .section {
      margin-top: 25px;
      padding: 15px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>
  <h2>Module-1: Equipment Information</h2>
  <div id="root"></div>

  <script type="text/babel">
    const API_URL = "http://127.0.0.1:8000/api/module1/equipment";

    function App() {
      const [form, setForm] = React.useState({
        eut_name: "",
        eut_quantity: "",
        manufacturer_address: "",
        model_no: "",
        serial_no: "",
        supply_voltage: "",
        operating_frequency: "",
        current: "",
        weight_kg: "",
        length_mm: "",
        width_mm: "",
        height_mm: "",
        power_ports: "",
        signal_ports: "",
        software_name: "",
        software_version: "",
        industry_type: "",
        other_industry: "",
        preferred_testing_date: "",
        additional_notes: "",
        operating_frequency: null,
        software_name: null,
        software_version: null,
        preferred_testing_date: null,
        additional_notes: null

      });

      const [data, setData] = React.useState([]);

      const handleChange = (e) => {
        setForm({ ...form, [e.target.name]: e.target.value });
      };

      const submitForm = () => {
        fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ...form,
            eut_quantity: Number(form.eut_quantity),
            weight_kg: Number(form.weight_kg),
            length_mm: Number(form.length_mm),
            width_mm: Number(form.width_mm),
            height_mm: Number(form.height_mm)
          })
        })
        .then(res => res.json())
        .then(() => {
          alert("Equipment saved successfully");
          loadData();
        });
      };

      const loadData = () => {
        fetch(API_URL)
          .then(res => res.json())
          .then(setData);
      };

      React.useEffect(loadData, []);

      return (
        <>
          <div className="section">
            <h3>Basic Equipment Information</h3>
            <input name="eut_name" placeholder="Name of EUT" onChange={handleChange} />
            <input name="eut_quantity" type="number" placeholder="Quantity" onChange={handleChange} />
            <textarea name="manufacturer_address" placeholder="Manufacturer / Address" onChange={handleChange} />
            <input name="model_no" placeholder="Model No" onChange={handleChange} />
            <input name="serial_no" placeholder="Serial No" onChange={handleChange} />
          </div>

          <div className="section">
            <h3>Technical Specifications</h3>
            <input name="supply_voltage" placeholder="Supply Voltage" onChange={handleChange} />
            <input name="operating_frequency" placeholder="Operating Frequency" onChange={handleChange} />
            <input name="current" placeholder="Current" onChange={handleChange} />
            <input name="weight_kg" type="number" placeholder="Weight (Kg)" onChange={handleChange} />
            <input name="length_mm" type="number" placeholder="Length (mm)" onChange={handleChange} />
            <input name="width_mm" type="number" placeholder="Width (mm)" onChange={handleChange} />
            <input name="height_mm" type="number" placeholder="Height (mm)" onChange={handleChange} />
          </div>

          <div className="section">
            <h3>Connectivity & Interfaces</h3>
            <input name="power_ports" placeholder="Power Ports & Connector Type" onChange={handleChange} />
            <input name="signal_ports" placeholder="Signal Lines & Connector Type" onChange={handleChange} />
          </div>

          <div className="section">
            <h3>Software Information</h3>
            <input name="software_name" placeholder="Software Name" onChange={handleChange} />
            <input name="software_version" placeholder="Software Version" onChange={handleChange} />
          </div>

          <div className="section">
            <h3>Industry / Application</h3>
            <select name="industry_type" onChange={handleChange}>
              <option value="">Select Industry</option>
              <option>Telecommunication</option>
              <option>Medical</option>
              <option>Automotive</option>
              <option>Industrial</option>
              <option>Consumer Electronics</option>
              <option>IoT</option>
              <option>Aerospace & Defense</option>
              <option>Energy & Power</option>
              <option>Others</option>
            </select>
            <input name="other_industry" placeholder="If Others, specify" onChange={handleChange} />
          </div>

          <div className="section">
            <h3>Testing & Notes</h3>
            <input name="preferred_testing_date" type="date" onChange={handleChange} />
            <textarea name="additional_notes" placeholder="Additional Notes" onChange={handleChange} />
          </div>

          <button onClick={submitForm}>Submit Equipment</button>

          <div className="section">
            <h3>Stored Equipment Records</h3>
            <ul>
              {data.map(item => (
                <li key={item.id}>
                  {item.eut_name} | {item.industry_type} | Model: {item.model_no}
                </li>
              ))}
            </ul>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
