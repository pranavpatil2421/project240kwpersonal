<!-- Basic Page for Equipment Information Page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Equipment Submission</title>
  <!-- Use CDN for React, ReactDOM, Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input, textarea, select { width: 300px; margin-bottom: 8px; padding: 6px; }
    button { padding: 8px 16px; margin-top: 10px; }
    .section { margin-top: 25px; padding: 15px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h2>Module-1: Equipment Information</h2>
  <div id="root"></div>
  <script type="text/babel">
    const API_URL = "/api/equipment";

    function App() {
      const [form, setForm] = React.useState({
        name: "",
        quantity: "",
        manufacturer_address: "",
        model_number: "",
        serial_number: "",
        supply_voltage: "",
        operating_frequency: "",
        current: "",
        weight_kg: "",
        length_mm: "",
        width_mm: "",
        height_mm: "",
        power_ports: "",
        signal_ports: "",
        software_name: "",
        software_version: "",
        industry_type: "",
        other_industry: "",
        preferred_testing_date: "",
        additional_notes: ""
      });

      const [data, setData] = React.useState([]);

      const handleChange = (e) => {
        setForm({ ...form, [e.target.name]: e.target.value });
      };

      const submitForm = () => {
        const payload = {
          ...form,
          quantity: form.quantity ? Number(form.quantity) : 0,
          weight_kg: form.weight_kg ? Number(form.weight_kg) : 0,
          length_mm: form.length_mm ? Number(form.length_mm) : 0,
          width_mm: form.width_mm ? Number(form.width_mm) : 0,
          height_mm: form.height_mm ? Number(form.height_mm) : 0,
          operating_frequency: form.operating_frequency || null,
          software_name: form.software_name || null,
          software_version: form.software_version || null,
          other_industry: form.other_industry || null,
          preferred_testing_date: form.preferred_testing_date || null,
          additional_notes: form.additional_notes || null
        };

        fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
        .then(async res => {
          if (!res.ok) {
            const err = await res.json();
            alert("Error: " + JSON.stringify(err.detail));
            return;
          }
          alert("Equipment saved successfully");
          setForm({
            name: "",
            quantity: "",
            manufacturer_address: "",
            model_number: "",
            serial_number: "",
            supply_voltage: "",
            operating_frequency: "",
            current: "",
            weight_kg: "",
            length_mm: "",
            width_mm: "",
            height_mm: "",
            power_ports: "",
            signal_ports: "",
            software_name: "",
            software_version: "",
            industry_type: "",
            other_industry: "",
            preferred_testing_date: "",
            additional_notes: ""
          });
          loadData();
        });
      };

      const loadData = () => {
        fetch(API_URL)
          .then(res => res.json())
          .then(setData);
      };

      React.useEffect(loadData, []);

      return (
        <>
          <div className="section">
            <h3>Basic Equipment Information</h3>
            <input name="name" placeholder="Name of EUT" value={form.name} onChange={handleChange} />
            <input name="quantity" type="number" placeholder="Quantity" value={form.quantity} onChange={handleChange} />
            <textarea name="manufacturer_address" placeholder="Manufacturer / Address" value={form.manufacturer_address} onChange={handleChange} />
            <input name="model_number" placeholder="Model No" value={form.model_number} onChange={handleChange} />
            <input name="serial_number" placeholder="Serial No" value={form.serial_number} onChange={handleChange} />
          </div>

          <div className="section">
            <h3>Technical Specifications</h3>
            <input name="supply_voltage" placeholder="Supply Voltage" value={form.supply_voltage} onChange={handleChange} />
            <input name="operating_frequency" placeholder="Operating Frequency" value={form.operating_frequency} onChange={handleChange} />
            <input name="current" placeholder="Current" value={form.current} onChange={handleChange} />
            <input name="weight_kg" type="number" placeholder="Weight (Kg)" value={form.weight_kg} onChange={handleChange} />
            <input name="length_mm" type="number" placeholder="Length (mm)" value={form.length_mm} onChange={handleChange} />
            <input name="width_mm" type="number" placeholder="Width (mm)" value={form.width_mm} onChange={handleChange} />
            <input name="height_mm" type="number" placeholder="Height (mm)" value={form.height_mm} onChange={handleChange} />
          </div>

          <div className="section">
            <h3>Connectivity & Interfaces</h3>
            <input name="power_ports" placeholder="Power Ports & Connector Type" value={form.power_ports} onChange={handleChange} />
            <input name="signal_ports" placeholder="Signal Lines & Connector Type" value={form.signal_ports} onChange={handleChange} />
          </div>

          <div className="section">
            <h3>Software Information</h3>
            <input name="software_name" placeholder="Software Name" value={form.software_name} onChange={handleChange} />
            <input name="software_version" placeholder="Software Version" value={form.software_version} onChange={handleChange} />
          </div>

          <div className="section">
            <h3>Industry / Application</h3>
            <select name="industry_type" value={form.industry_type} onChange={handleChange}>
              <option value="">Select Industry</option>
              <option>Telecommunication</option>
              <option>Medical</option>
              <option>Automotive</option>
              <option>Industrial</option>
              <option>Consumer Electronics</option>
              <option>IoT</option>
              <option>Aerospace & Defense</option>
              <option>Energy & Power</option>
              <option>Others</option>
            </select>
            <input name="other_industry" placeholder="If Others, specify" value={form.other_industry} onChange={handleChange} />
          </div>

          <div className="section">
            <h3>Testing & Notes</h3>
            <input name="preferred_testing_date" type="date" value={form.preferred_testing_date} onChange={handleChange} />
            <textarea name="additional_notes" placeholder="Additional Notes" value={form.additional_notes} onChange={handleChange} />
          </div>

          <button onClick={submitForm}>Submit Equipment</button>

          <div className="section">
            <h3>Stored Equipment Records</h3>
            <ul>
              {data.map(item => (
                <li key={item.id}>
                  {item.name} | {item.industry_type} | Model: {item.model_number}
                </li>
              ))}
            </ul>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
